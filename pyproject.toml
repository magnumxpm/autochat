[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autochatlib"
version = "0.1.1"
description = "A context-aware chat harness primitive built on LangChain and LangGraph."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Pritam Mukherjee", email = "me@pmukherjee.dev"},
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.17",
    "langchain-core>=1.3.2",
    "langgraph>=1.1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
keywords = [
    "ai",
    "chat",
    "langchain",
    "langgraph",
    "llm",
]

[project.urls]
Homepage = "https://github.com/magnumxpm/autochat"
Repository = "https://github.com/magnumxpm/autochat"
Issues = "https://github.com/magnumxpm/autochat/issues"

[dependency-groups]
dev = [
    "langchain-openai>=1.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autochat"]

[tool.hatch.build.targets.sdist]
include = [
    "src/autochat",
    "examples",
    "README.md",
    "LICENSE",
]
