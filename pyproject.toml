[project]
name = "autochat"
version = "0.1.0"
description = "An automated chat harness primitive built on LangChain and LangGraph primitives"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Pritam Mukherjee", email = "me@pmukherjee.dev"}]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.17",
    "langchain-core>=1.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autochat"]
